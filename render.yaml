services:
  # Express API (chat, journal, auth, webhooks, ...)
  - type: web
    name: lumaya-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false # e.g. https://lumaya-frontend.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false # Render Key Value instance, or an external Redis (e.g. Upstash)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        sync: false
      - key: PINECONE_INDEX2
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY1
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WEBHOOK_SECRET_KEY
        sync: false

  # React/Vite static site
  - type: web
    name: lumaya-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # the lumaya-backend URL above, once deployed
      - key: VITE_FRONTEND_URL
        sync: false # this site's own URL
      - key: VITE_REDIRECT_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_PADDLE_CLIENT_TOKEN
        sync: false
