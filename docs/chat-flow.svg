<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1730" width="1220" height="1730" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1220" height="1730" fill="#ffffff"/>
<rect x="290" y="20" width="220" height="44" rx="22.0" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="400.0" y="39.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">User sends a message</text>
<text x="400.0" y="53.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">POST /api/chatbot/chat</text>
<rect x="280" y="100" width="240" height="48" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="400.0" y="121.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Authenticate + rate limit</text>
<text x="400.0" y="135.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">Supabase JWT</text>
<rect x="270" y="184" width="260" height="56" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="400.0" y="209.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Load state</text>
<text x="400.0" y="223.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">cache, else Redis (one pipelined read)</text>
<polygon points="400.0,276 510,318.0 400.0,360 290,318.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="400.0" y="315.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Locked out by</text>
<text x="400.0" y="329.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">an earlier SOS?</text>
<rect x="700" y="291" width="260" height="54" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="830.0" y="315.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Crisis resources + time remaining</text>
<text x="830.0" y="329.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">no model call</text>
<rect x="260" y="396" width="280" height="56" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="400.0" y="421.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Read the message (in parallel)</text>
<text x="400.0" y="435.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">SOS check  ·  state + task read</text>
<polygon points="400.0,488 510,530.0 400.0,572 290,530.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="400.0" y="527.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Self-harm</text>
<text x="400.0" y="541.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">intent?</text>
<rect x="700" y="503" width="260" height="54" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="830.0" y="527.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Lock for 24 h (Redis TTL)</text>
<text x="830.0" y="541.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">send crisis response</text>
<polygon points="400.0,608 510,650.0 400.0,692 290,650.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="400.0" y="647.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Asking for a task or</text>
<text x="400.0" y="661.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">probing the model?</text>
<rect x="700" y="623" width="260" height="54" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="830.0" y="647.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Deflect playfully, in character</text>
<text x="830.0" y="661.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">maths, code, trivia, homework, jailbreak</text>
<rect x="250" y="728" width="300" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="400.0" y="753.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Choose the conversation mode</text>
<text x="400.0" y="767.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">intro · name · onboarding · welcome · regular</text>
<polygon points="400.0,820 510,862.0 400.0,904 290,862.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="400.0" y="859.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Regular chat</text>
<text x="400.0" y="873.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">(after onboarding)?</text>
<rect x="110" y="940" width="250" height="64" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="235.0" y="969.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Use the state from that read</text>
<text x="235.0" y="983.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">heuristic + LLM, smoothed over turns</text>
<rect x="470" y="940" width="250" height="64" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="595.0" y="969.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Semantic memory lookup</text>
<text x="595.0" y="983.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">Pinecone, top 5 summaries for this user</text>
<rect x="110" y="1040" width="250" height="64" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="235.0" y="1069.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Pick the persona</text>
<text x="235.0" y="1083.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">state → style; else weighted random</text>
<rect x="250" y="1140" width="300" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="400.0" y="1165.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Build the prompt</text>
<text x="400.0" y="1179.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">persona + profile + memories + recent turns</text>
<rect x="280" y="1232" width="240" height="48" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="400.0" y="1260.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Gemini generates the reply</text>
<polygon points="400.0,1316 510,1358.0 400.0,1400 290,1358.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="400.0" y="1355.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Reply reveals</text>
<text x="400.0" y="1369.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">AI / technical terms?</text>
<rect x="700" y="1331" width="260" height="54" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="830.0" y="1355.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Rewrite in persona</text>
<text x="830.0" y="1369.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">Gemini rewrite pass</text>
<rect x="250" y="1436" width="300" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="400.0" y="1461.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Humanize the reply</text>
<text x="400.0" y="1475.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">light typos, punctuation, filler words</text>
<rect x="250" y="1522" width="300" height="56" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="400.0" y="1547.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Save to Redis + refresh cache</text>
<text x="400.0" y="1561.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">name, onboarding profile if needed</text>
<polygon points="400.0,1612 510,1654.0 400.0,1696 290,1654.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="400.0" y="1651.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">More than 20</text>
<text x="400.0" y="1665.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">messages?</text>
<rect x="700" y="1627" width="300" height="54" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="850.0" y="1651.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Compact: summarize, keep last 4 turns</text>
<text x="850.0" y="1665.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">tag mood + topic → embed → Pinecone</text>
<rect x="40" y="1640" width="220" height="44" rx="22.0" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
<text x="150.0" y="1659.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Return reply + emotion</text>
<text x="150.0" y="1673.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">avatar picks an expression</text>
<rect x="1010" y="20" width="150" height="44" rx="22.0" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
<text x="1085.0" y="39.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Reply sent</text>
<text x="1085.0" y="53.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#374151">chat stays locked</text>
<rect x="40" y="20" width="150" height="26" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="115.0" y="37.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Process</text>
<rect x="40" y="54" width="150" height="26" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="115.0" y="71.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Model call</text>
<rect x="40" y="88" width="150" height="26" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="115.0" y="105.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Memory / data</text>
<rect x="40" y="122" width="150" height="26" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="115.0" y="139.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Crisis path</text>
